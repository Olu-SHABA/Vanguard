
# Tests, on every push.
#
# The suite was thorough before this existed — 1,380 tests across two
# dependency profiles — but it ran when someone remembered to type `pytest`.
# That is discipline, not continuous integration, and discipline fails
# silently: a file edited after the last run shipped two failures.
#
# Two jobs, because they answer different questions.
#
#   fast   base dependencies only. Answers "did I break anything" in under a
#          minute, while the change is still in mind. Tests needing torch or
#          weasyprint skip themselves.
#
#   full   everything installed. Slower, and the only job that actually
#          exercises scoring and PDF rendering.
#
# `fast` is not a subset chosen by hand — it is the same suite with fewer
# things installed, and the markers decide. A hand-picked subset drifts.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push supersedes the first. No point finishing a run against code
  # that has already been replaced.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast — base dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Create mock CV data file for tests
        run: |
          mkdir -p data
          echo "# Olu-SHABA" > data/canonical_cv.md
          echo "Email: contact@example.com" >> data/canonical_cv.md
          echo "Phone: 000000" >> data/canonical_cv.md

      - name: Test
        run: pytest -q --durations=10

      # The suite runs in two credential states and must behave the same in
      # both. No secrets are used: the "with credentials" state uses obvious
      # placeholders, because what is under test is the code path, not the
      # key.
      - name: Test with credentials present
        env:
          ADZUNA_APP_ID: ci-placeholder
          ADZUNA_APP_KEY: ci-placeholder
          REED_API_KEY: ci-placeholder
        run: pytest -q

  full:
    name: full — scoring and rendering
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only after `fast` passes. No sense downloading two gigabytes of torch to
    # discover a syntax error.
    needs: fast

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # WeasyPrint is a Python package that loads cairo, pango and
      # gdk-pixbuf through ctypes. Without these it imports and then fails at
      # render time, which is why the render tests check usability rather
      # than importability.
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 \
                                  libcairo2 libgdk-pixbuf-2.0-0

      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,scoring]"
          python -m spacy download en_core_web_sm

      - name: Create mock CV data file for tests
        run: |
          mkdir -p data
          echo "# Olu-SHABA" > data/canonical_cv.md
          echo "Email: contact@example.com" >> data/canonical_cv.md
          echo "Phone: 000000" >> data/canonical_cv.md

      - name: Test
        run: pytest -q --durations=10

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Advisory. A style complaint should not block a correct fix, and a
      # lint job that blocks gets disabled the first time it is wrong.
      - name: Ruff
        run: ruff check src tests
        continue-on-error: true
