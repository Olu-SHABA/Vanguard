# Project Vanguard — alias table
#
# Resolves stage-2 of the COVERAGE computation (directive §2).
# A job-spec requirement term matching any `aliases` entry resolves to HIT,
# with `cv_evidence` and `source_role` carried into the Template A record.
#
# tier A — direct synonym or renaming. Safe. Auto-HIT.
# tier B — domain translation. Defensible, operator-confirmed. Auto-HIT.
# tier C — EXCLUDED. Tempting but not equivalent. Never resolves to HIT.
#
# RULE: no entry may exist without a canonical_cv.md line behind it.
# Adding an alias without CV evidence converts a Type 3 gap into a false HIT,
# which defeats the truthfulness constraint the gate exists to enforce.

version: 0.5
canonical_cv: canonical_cv.md

