# Project Vanguard — job board registry
# Hot-reloadable. Adding or removing a board is a config change, never a code change.
#
# tier:     api_official | feed | manual
# priority: dedup rank. Lowest integer wins on collision.
# silence_days: overrides global default for DORMANT transition.

defaults:
  silence_days: 21

  # Coverage gate. Authored at 0.94 during the audit; that value was never
  # measured. First live run, 9 Aug 2026: of 43 vacancies, ZERO reached 0.94
  # and the best genuine fit (Machine Learning Engineer, C=0.700) had a
  # ceiling of 0.800 — structurally incapable of passing.
  #
  # Ratchet upward as the CV strengthens and outcome data accumulates.
  # Observed on that run:  0.60 -> 2 pass, 15 reachable
  #                        0.70 -> 1 pass, 13 reachable
  #                        0.85 -> 0 pass,  6 reachable
  coverage_gate: 0.60

  # Rank-score floor for the pre-filter. Document-level similarity costs one
  # embedding; hydration and scoring cost an API call plus per-term work.
  # Vacancies below this floor are not hydrated and not scored.
  rank_floor: 0.25
  rate_limit:
    calls_per_hour: 60
    backoff: exponential

boards:

  - id: adzuna
    adapter: ManualEntryAdapter
    enabled: true
    tier: manual                     # NOT a terms restriction — a capability one
    supplies_full_text: false
    priority: 1                      # dedup master — widest aggregated corpus
    auth:
      app_id: ${ADZUNA_APP_ID}
      app_key: ${ADZUNA_APP_KEY}
    query:
      # `country` is the API path segment (/gb/, /us/, /au/ ...). Changing the
      # target country means changing THIS, not `where`. `where` is a place
      # within the chosen country.
      country: gb
      what: ["data scientist", "machine learning engineer", "network analytics"]
      where: "UK"
      max_days_old: 7
    note: "DEMOTED TO MANUAL 9 Aug 2026. The free API caps every description at
           exactly 500 characters and offers no detail endpoint, so requirement
           extraction finds one or two terms and coverage becomes meaningless —
           a Service Centre Team Manager scored C=1.000. Good for DISCOVERY,
           useless for ASSESSMENT. Browse at adzuna.co.uk, paste with
           `vanguard paste --board adzuna`. Credentials retained in case a
           full-text tier becomes available."

  - id: reed
    adapter: ReedAPIAdapter
    enabled: true
    tier: api_official
    priority: 2
    supplies_full_text: true         # via the /jobs/{id} detail endpoint
    auth:
      api_key: ${REED_API_KEY}
    query:
      # Without `what`, no keywords parameter is sent and the search returns
      # the entire Reed index — 87,000+ vacancies of HGV drivers and
      # optometrists. Every enabled API board needs its own keyword list.
      what: ["data scientist", "machine learning engineer", "network analytics"]
      # `locationName` is a PLACE and carries a 10-mile default radius. "UK" is
      # not a place; leaving it unset searches nationwide, which is what is
      # wanted here.
      where: ""
      # Every vacancy costs a SECOND api call to fetch its full text, against
      # a 60 calls/hour limit. 3 keywords x 15 = 45 hydration calls plus a
      # handful of search calls fits inside one hour. Raising this does not
      # get more assessable vacancies — it gets more unhydrated ones.
      max_results: 15
    note: "Self-service. Jobseeker search endpoint returns title, employer,
           description, location, salary range. Keyword list is mandatory —
           an absent `what` returns the whole index."

  - id: nhs_jobs
    adapter: NHSJobsAPIAdapter
    enabled: false                   # pending NHSBSA access arrangement
    tier: api_official
    priority: 2
    silence_days: 30
    note: "Official API exists for publishing NHS Jobs vacancies to third-party
           sites. Access arranged via NHSBSA Training and Support, not self-service."

  - id: civil_service_jobs
    adapter: EmailAlertAdapter
    enabled: true
    tier: manual                     # alert emails carry summaries, not adverts
    supplies_full_text: false
    priority: 2
    silence_days: 30
    portal_url: "https://www.civilservicejobs.service.gov.uk/csr/index.cgi"
    ingress:
      mailbox_folder: "CS-Jobs-Alerts"
      sender: "*.civilservicejobs.service.gov.uk"
    note: "No public API. Portal serves a bot-detection interstitial and sets
           meta-robots noindex — automated collection is explicitly discouraged.
           Alert emails are the sanctioned route. portal_url is operator-facing:
           used to configure the saved search and for manual vacancy paste.
           NEVER fetched by the pipeline. Submission type SUCCESS_PROFILE —
           anonymised CV plus word-limited Personal Statement, Template F."

  - id: findajob_dwp
    adapter: FindAJobAdapter
    enabled: false                   # BLOCKED: verify platform migration status
    tier: api_official
    priority: 3
    note: "Adzuna-derived corpus — high duplicate overlap with adzuna.
           DWP in-house replacement was scheduled for June 2026.
           Verify current API contract before enabling."

  - id: linkedin
    adapter: ManualEntryAdapter
    enabled: true
    tier: manual
    priority: 9
    note: "User Agreement prohibits automated collection. Operator pastes URL
           or text. All downstream scoring and drafting still applies."

  - id: totaljobs
    adapter: EmailAlertAdapter
    enabled: false
    tier: feed
    priority: 4
    note: "No public jobseeker API found. StepStone-owned — expect heavy
           duplicate overlap with cwjobs. Alert-email route available."

  - id: cwjobs
    adapter: EmailAlertAdapter
    enabled: false
    tier: feed
    priority: 4
    note: "No public jobseeker API found. StepStone-owned — see totaljobs."

  - id: cv_library
    adapter: EmailAlertAdapter
    enabled: false
    tier: feed
    priority: 4
    note: "No public jobseeker API found. Alert-email route available."

  - id: monster_uk
    adapter: EmailAlertAdapter
    enabled: false
    tier: feed
    priority: 5
    note: "No public jobseeker API found. Ownership has changed hands
           repeatedly — verify current terms before enabling."
