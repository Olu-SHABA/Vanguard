[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard"
version = "0.1.0"
description = "Semi-autonomous job application pipeline"
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "markdown>=3.5",
    "weasyprint>=61.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# The pane view. Optional because the commands are unaffected without it —
# the panes are an extra way in, not a replacement.
panes = [
    "textual>=0.50",
]

# Installed at Milestone 2. Pulls torch (~2GB) — deliberately not a base dep,
# so M1 remains installable without it.
scoring = [
    "pandas>=2.0",
    "numpy>=1.26",
    "sentence-transformers>=2.5",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
vanguard = "vanguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
